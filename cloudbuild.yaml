# Cloud Build pipeline for psybot-api.
#
# Submit:
#     gcloud builds submit --config cloudbuild.yaml \
#       --substitutions=_TAG=$(git rev-parse --short HEAD),_REGION=europe-west1
#
# The pipeline:
#   1. builds the Dockerfile with BuildKit
#   2. pushes the image
#   3. deploys to Cloud Run (managed), wiring env vars + Secret Manager refs
#
# The actual deploy step is OPTIONAL — you can drop it from this file and
# run `gcloud run deploy` separately if you prefer explicit human approval.

steps:
  # 1. Build the container image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api:latest
      - .

  # 2. Push to Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api

  # 3. Deploy to Cloud Run. Secrets are pulled from Secret Manager.
  #    Adjust region / min-instances / concurrency for your own SLOs.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - psybot-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=10
      - --timeout=30
      - --cpu-boost
      - --set-env-vars=PSYBOT_KNOWLEDGE_DIR=/app/knowledge,PSYBOT_MAX_ITERS=3,PSYBOT_TEMPERATURE=0.4,PSYBOT_MAX_TOKENS=700,DEEPSEEK_MODEL=deepseek-chat,DEEPSEEK_API_URL=https://api.deepseek.com/v1
      - --set-secrets=DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/psybot/api:latest

substitutions:
  _TAG: latest
  _REGION: europe-west1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8